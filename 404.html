<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connection Lost | STACKLY 404</title>
    <!-- GSAP for Cinematic Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
      :root {
        --primary-red: #e30613;
        --navy: #0b0f2b;
        --deep-blue: #050c2f;
        --light-bg: #f4f4f6;
        --text-gray: #6b7280;
        --soft-pink: #fde8ea;
        --white: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        background-color: var(--deep-blue);
        color: var(--white);
        overflow: hidden; /* Prevent scroll for the immersive experience */
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Network Background Grid & Canvas */
      .bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
      }

      #network-canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
      }

      /* Main Container */
      .main-container {
        max-width: 1100px;
        width: 90%;
        text-align: center;
        padding: 20px;
        z-index: 10;
      }

      /* Huge 404 Text */
      .error-code {
        font-weight: 900;
        line-height: 1;
        margin-bottom: 10px;
        background: linear-gradient(
          135deg,
          var(--primary-red),
          var(--soft-pink)
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-stroke: 1px transparent;
        color: transparent;
        font-size: 80px;
        filter: drop-shadow(0 0 15px rgba(227, 6, 19, 0.4));
        position: relative;
        -webkit-text-fill-color: transparent;
        background-image: linear-gradient(
          135deg,
          var(--primary-red),
          var(--soft-pink)
        );
      }

      /* Heading & Description */
      .status-heading {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 15px;
        letter-spacing: -0.5px;
      }

      .description {
        font-size: 16px;
        color: var(--text-gray);
        max-width: 500px;
        margin: 0 auto 40px auto;
        line-height: 1.6;
      }

      /* Button Styling */
      .reconnect-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 50px;
        background: var(--primary-red);
        color: var(--white);
        text-decoration: none;
        font-weight: 600;
        border-radius: 6px;
        overflow: hidden;
        border: none;
        cursor: pointer;
        z-index: 1;
        transition: color 0.4s ease;
      }

      .reconnect-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: var(--white);
        z-index: -1;
        transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      }

      .reconnect-btn:hover::before {
        left: 0;
      }

      .reconnect-btn:hover {
        color: var(--primary-red);
      }

      /* Icons Section - Row arrangement by default */
      .icon-section {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 60px;
      }

      .icon-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        width: 70px;
        height: 70px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .icon-card svg {
        width: 28px;
        height: 28px;
        fill: var(--white);
        opacity: 0.8;
      }

      /* Responsive Breakpoints */
      @media (min-width: 768px) {
        .error-code {
          font-size: 140px;
        }
        .status-heading {
          font-size: 32px;
        }
        .icon-section {
          gap: 40px;
        }
        .icon-card {
          width: 80px;
          height: 80px;
        }
        .icon-card svg {
          width: 32px;
          height: 32px;
        }
        .reconnect-btn {
          width: 220px;
        }
      }

      @media (min-width: 1024px) {
        .error-code {
          font-size: 220px;
        }
        .status-heading {
          font-size: 38px;
        }
        .description {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-overlay" id="parallax-bg"></div>
    <canvas id="network-canvas"></canvas>

    <main class="main-container">
      <h1 class="error-code">404</h1>

      <h2 class="status-heading">Connection Lost</h2>

      <p class="description">
        The page you're looking for seems to be disconnected from the network.
        Let's reconnect you.
      </p>

      <a href="./index.html" class="reconnect-btn" id="magnetic-btn">
        Reconnect to Home
      </a>

      <div class="icon-section">
        <div class="icon-card" title="WiFi Status">
          <svg viewBox="0 0 24 24">
            <path
              d="M12,21L15.6,16.2C14.6,15.45 13.35,15 12,15C10.65,15 9.4,15.45 8.4,16.2L12,21M12,3C7.95,3 4.21,4.34 1.2,6.6L3,9C5.5,7.12 8.62,6 12,6C15.38,6 18.5,7.12 21,9L22.8,6.6C19.79,4.34 16.05,3 12,3M12,9C9.3,9 6.81,9.89 4.8,11.4L6.6,13.8C8.1,12.67 9.97,12 12,12C14.03,12 15.9,12.67 17.4,13.8L19.2,11.4C17.19,9.89 14.7,9 12,9Z"
            />
          </svg>
        </div>
        <div class="icon-card" title="Router Status">
          <svg viewBox="0 0 24 24">
            <path
              d="M20,13H4A2,2 0 0,0 2,15V19A2,2 0 0,0 4,21H20A2,2 0 0,0 22,19V15A2,2 0 0,0 20,13M7,19H5V17H7V19M10,19H8V17H10V19M13,19H11V17H13V19M16,19H14V17H16V19M21,11V9.5C21,6.5 18.5,4 15.5,4C14.1,4 12.8,4.5 11.8,5.4C10.8,4.5 9.4,4 8,4C5,4 2.5,6.5 2.5,9.5V11H4V9.5C4,7.3 5.8,5.5 8,5.5C9.2,5.5 10.3,6.1 11,7V11H12.5V7C13.2,6.1 14.3,5.5 15.5,5.5C17.7,5.5 19.5,7.3 19.5,9.5V11H21Z"
            />
          </svg>
        </div>
        <div class="icon-card" title="Tower Status">
          <svg viewBox="0 0 24 24">
            <path
              d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12C20,14.35 19,16.47 17.35,18L15.92,16.57C17.21,15.42 18,13.8 18,12A6,6 0 0,0 12,6A6,6 0 0,0 6,12C6,13.8 6.79,15.42 8.08,16.57L6.65,18C5,16.47 4,14.35 4,12A8,8 0 0,1 12,4M12,8A4,4 0 0,0 8,12C8,13.2 8.5,14.24 9.38,15L7.95,16.41C6.73,15.31 6,13.74 6,12A6,6 0 0,1 12,6A6,6 0 0,1 18,12C18,13.74 17.27,15.31 16.05,16.41L14.62,15C15.5,14.24 16,13.2 16,12A4,4 0 0,0 12,8M12,10A2,2 0 0,1 14,12C14,12.5 13.82,12.91 13.53,13.24L12,14.71L10.47,13.24C10.18,12.91 10,12.5 10,12A2,2 0 0,1 12,10Z"
            />
          </svg>
        </div>
      </div>
    </main>

    <script>
      const canvas = document.getElementById("network-canvas");
      const ctx = canvas.getContext("2d");
      let points = [];
      const pointCount = 40;
      const connectionDistance = 150;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      class Point {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.radius = Math.random() * 2 + 1;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(227, 6, 19, 0.4)";
          ctx.fill();
        }
      }

      function initNetwork() {
        points = [];
        for (let i = 0; i < pointCount; i++) {
          points.push(new Point());
        }
      }

      function animateNetwork() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < points.length; i++) {
          points[i].update();
          points[i].draw();
          for (let j = i + 1; j < points.length; j++) {
            const dx = points[i].x - points[j].x;
            const dy = points[i].y - points[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < connectionDistance) {
              ctx.beginPath();
              ctx.moveTo(points[i].x, points[i].y);
              ctx.lineTo(points[j].x, points[j].y);
              ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 * (1 - dist / connectionDistance)})`;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animateNetwork);
      }

      function initGSAP() {
        const tl = gsap.timeline();
        tl.from(".error-code", {
          opacity: 0,
          scale: 0.7,
          y: 60,
          duration: 1.2,
          ease: "power3.out",
        });

        tl.from(
          ".status-heading, .description",
          {
            opacity: 0,
            y: 40,
            duration: 0.8,
            stagger: 0.2,
            ease: "power3.out",
          },
          "-=0.6",
        );

        tl.from(
          ".icon-card",
          {
            scale: 0,
            opacity: 0,
            duration: 0.6,
            stagger: 0.15,
            ease: "back.out(1.7)",
          },
          "-=0.4",
        );

        gsap.to(".icon-card", {
          y: -10,
          duration: 3,
          repeat: -1,
          yoyo: true,
          ease: "sine.inOut",
          stagger: { each: 0.2, from: "random" },
        });

        const btn = document.getElementById("magnetic-btn");
        btn.addEventListener("mousemove", (e) => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          gsap.to(btn, {
            x: x * 0.3,
            y: y * 0.5,
            duration: 0.3,
            ease: "power2.out",
          });
        });

        btn.addEventListener("mouseleave", () => {
          gsap.to(btn, {
            x: 0,
            y: 0,
            duration: 0.5,
            ease: "elastic.out(1, 0.3)",
          });
        });

        window.addEventListener("mousemove", (e) => {
          const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
          const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
          gsap.to("#parallax-bg", { x: moveX, y: moveY, duration: 1 });
        });
      }

      window.addEventListener("resize", resize);
      window.onload = () => {
        resize();
        initNetwork();
        animateNetwork();
        initGSAP();
      };
    </script>
  </body>
</html>
